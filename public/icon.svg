<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonBrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1389" />
      <stop offset="45%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="innerFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180F33" />
      <stop offset="100%" stop-color="#0b061d" />
    </linearGradient>

    <linearGradient id="ttgTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF1389" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#9D4EDD" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#00F2FE" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Clean dark background #120c1f -->
  <rect width="512" height="512" fill="#120c1f" />

  <!-- Rounded neon frame with glowing gradient (pink/purple to cyan/blue) -->
  <rect x="71" y="71" width="370" height="370" rx="82" ry="82"
        fill="url(#innerFill)"
        stroke="url(#neonBrd)"
        stroke-width="12"
        filter="url(#neonGlow)" />

  <!-- Inner subtle neon line for high-definition depth -->
  <rect x="86" y="86" width="340" height="340" rx="68" ry="68"
        fill="none"
        stroke="rgba(255, 255, 255, 0.12)"
        stroke-width="1.5" />

  <!-- Centered 'TTG' in bold white-to-pink gradient font -->
  <text x="256" y="240"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="900"
        font-size="124"
        letter-spacing="-3"
        fill="url(#ttgTextGrad)"
        text-anchor="middle"
        dominant-baseline="central">TTG</text>

  <!-- Below 'TTG': 'TIME TO' and 'GUESS' in bold golden yellow -->
  <text x="256" y="322"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="26"
        letter-spacing="7"
        fill="#FDE047"
        text-anchor="middle">TIME TO</text>
  <text x="256" y="362"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="28"
        letter-spacing="9"
        fill="#FDE047"
        text-anchor="middle">GUESS</text>
</svg>