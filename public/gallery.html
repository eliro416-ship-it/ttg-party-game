<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מאגר קלפים מאומת - 30 קלפים</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0d14;
      color: #fff;
      margin: 0;
      padding: 20px 16px 80px 16px;
      overflow-y: auto;
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }
    h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-count {
      font-size: 0.8rem;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 2px 10px;
      border-radius: 9999px;
      border: 1px solid #3b82f6;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .btn-home {
      background: #ef4444;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn-home:hover { background: #dc2626; }
    .tabs {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { background: #1e293b; }
    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background-color: #181f30;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #64748b;
    }
    .img-wrap {
      width: 100%;
      height: 192px;
      background: #0f172a;
      overflow: hidden;
      position: relative;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .pack-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .info {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .word {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      display: block;
    }
    .letters {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .badge {
      font-size: 0.75rem;
      background: #2563eb;
      color: #fff;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .verified {
      color: #34d399;
      font-size: 0.75rem;
      display: block;
      margin-top: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>
        <span>🖼️ מאגר קלפים מאומת (30 קלפים)</span>
        <span class="badge-count" id="count-badge">30 קלפים</span>
      </h1>
      <div class="subtitle">30 קלפים מאומתים ב-100% ללא תמונות טלפון או קישורים שבורים</div>
    </div>
    <a href="/" class="btn-home">חזרה למשחק</a>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="filterPack('all', this)">✨ הכל (30)</button>
    <button class="tab-btn" onclick="filterPack('starter_free', this)">🎁 בסיס חינם (10)</button>
    <button class="tab-btn" onclick="filterPack('animals_pro', this)">🦁 עולם החיות (10)</button>
    <button class="tab-btn" onclick="filterPack('food_and_fun', this)">🍕 מאכלים וחפצים (10)</button>
  </div>

  <div class="grid" id="cards-grid"></div>

      // עולם החיות (10)

      // מאכלים וחפצים (10)
      { id: 'm1', packId: 'food_and_fun', packName: 'מאכלים וחפצים', word: 'גלידה', category: 'מאכלים', imageUrl: 'https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=600&auto=format&fit=crop&q=80' },

      { id: 'm6', packId: 'food_and_fun', packName: 'מאכלים וחפצים', word: 'תות', category: 'מאכלים', imageUrl: 'https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=600&auto=format&fit=crop&q=80' },
      { id: 'm7', packId: 'food_and_fun', packName: 'מאכלים וחפצים', word: 'שעון', category: 'חפצים', imageUrl: 'https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600&auto=format&fit=crop&q=80' },
      { id: 'm8', packId: 'food_and_fun', packName: 'מאכלים וחפצים', word: 'מצלמה', category: 'חפצים', imageUrl: 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600&auto=format&fit=crop&q=80' },
      { id: 'm9', packId: 'food_and_fun', packName: 'מאכלים וחפצים', word: 'משקפיים', category: 'חפצים', imageUrl: 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600&auto=format&fit=crop&q=80' },
      { id: 'm10', packId: 'food_and_fun', packName: 'מאכלים וחפצים', word: 'אופניים', category: 'חפצים', imageUrl: 'https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=600&auto=format&fit=crop&q=80' }
    ];

    function renderCards(list) {
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = list.map(item => `
        <div class="card">
          <div class="img-wrap">
            <img src="${item.imageUrl}" alt="${item.word}" crossorigin="anonymous" loading="lazy" onerror="this.style.display='none'">
            <span class="pack-tag">${item.packName}</span>
          </div>
          <div class="info">
            <div>
              <span class="word">${item.word}</span>
              <span class="letters">${item.word.length} אותיות</span>
            </div>
            <div style="text-align: left;">
              <span class="badge">${item.category}</span>
              <span class="verified">✓ מאומת</span>
            </div>
          </div>
        </div>
      `).join('');
      document.getElementById('count-badge').textContent = list.length + ' קלפים';
    }

    function filterPack(packId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (packId === 'all') {
        renderCards(CARDS);
      } else {
        renderCards(CARDS.filter(c => c.packId === packId));
      }
    }

    // Initial render
    renderCards(CARDS);
  </script>
</body>
</html>
