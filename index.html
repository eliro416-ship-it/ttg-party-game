      <!-- Completely suppress and remove any Netlify badge or third-party platform overlay -->
    <style>
      [data-netlify],
      [data-netlify-badge],
      .netlify-badge,
      #netlify-badge,
      a[href*="netlify" i],
      img[src*="netlify" i],
      img[alt*="netlify" i],
      [aria-label*="netlify" i],
      div[class*="netlify" i],
      div[id*="netlify" i],
      iframe[src*="netlify" i],
      span[class*="netlify" i],
      aside[class*="netlify" i],
      footer a[href*="netlify" i] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -99999px !important;
        left: -99999px !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        function purgeNetlifyBadge() {
          try {
            var targets = document.querySelectorAll(
              'a[href*="netlify" i], img[src*="netlify" i], img[alt*="netlify" i], [class*="netlify" i], [id*="netlify" i], [data-netlify]'
            );
            for (var i = 0; i < targets.length; i++) {
              targets[i].remove();
            }
            var allElements = document.querySelectorAll('a, div, span, p, footer, button, aside');
            for (var j = 0; j < allElements.length; j++) {
              var el = allElements[j];
              var txt = (el.textContent || '').trim();
              if (/powered\s*by\s*netlify/i.test(txt) || (/netlify/i.test(txt) && txt.length < 50)) {
                if (el.id !== 'root' && el.tagName !== 'BODY' && el.tagName !== 'HTML') {
                  el.remove();
                }
              }
            }
          } catch (e) {}
        }
        if (typeof document !== 'undefined') {
          purgeNetlifyBadge();
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', purgeNetlifyBadge);
          }
          window.addEventListener('load', purgeNetlifyBadge);
          try {
            var observer = new MutationObserver(purgeNetlifyBadge);
            observer.observe(document.documentElement, { childList: true, subtree: true });
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body class="bg-[#0F172A] text-slate-100 antialiased selection:bg-pink-500 selection:text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            registration.onupdatefound = function() {
              var installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function() {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // נמצאה גרסה חדשה – רענן את העמוד אוטומטית
                    window.location.reload();
                  }
                };
              }
            };
            if (registration.update) {
              registration.update().catch(function() {});
            }
          }).catch(function(err) {
            console.warn('SW registration error:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
