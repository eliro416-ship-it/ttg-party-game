    // ==========================================
    // 3. SOUND SYNTHESIZER (Web Audio + Speech)
    // ==========================================
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.isMuted = localStorage.getItem('game_sound_muted') === 'true';
        this.voiceGender = localStorage.getItem('ttg_voice_gender') || 'female';
        this.cachedVoices = [];
        if ('speechSynthesis' in window) {
          this.loadVoices();
          window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
        }
      }

      loadVoices() {
        try {
          this.cachedVoices = window.speechSynthesis.getVoices() || [];
        } catch {
          this.cachedVoices = [];
        }
      }

      setVoiceGender(gender) {
        this.voiceGender = gender;
        localStorage.setItem('ttg_voice_gender', gender);
      }

      getContext() {
        if (this.isMuted) return null;
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        localStorage.setItem('game_sound_muted', String(this.isMuted));
        if (this.isMuted && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        return this.isMuted;
      }

      playTone(freq, duration, type = 'sine', volume = 0.1) {
        const ctx = this.getContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(volume, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch(e) {}
      }

      soundKeypress() { this.playTone(550, 0.04, 'sine', 0.05); }
      soundDelete() { this.playTone(320, 0.06, 'triangle', 0.06); }
      soundTick() { this.playTone(420, 0.04, 'triangle', 0.08); }
      soundWarning() { this.playTone(700, 0.07, 'sawtooth', 0.07); }
      soundSuccess() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.22, 'triangle', 0.14), idx * 110);
        });
      }
      soundError() {
        this.playTone(180, 0.28, 'sawtooth', 0.12);
        setTimeout(() => this.playTone(140, 0.35, 'sawtooth', 0.14), 120);
      }
      soundHint() {
        this.playTone(880, 0.12, 'sine', 0.1);
        setTimeout(() => this.playTone(1174.66, 0.2, 'sine', 0.1), 90);
      }
      soundWin() {
        const melody = [523.25, 659.25, 783.99, 1046.5];
        melody.forEach((f, i) => setTimeout(() => this.playTone(f, 0.3, 'triangle', 0.16), i * 130));
      }
      soundYes(m = 1) {
        this.playTone(587.33 * m, 0.12, 'sine', 0.12);
        setTimeout(() => this.playTone(880 * m, 0.2, 'sine', 0.14), 80);
      }
      soundNo(m = 1) {
        this.playTone(280 * m, 0.15, 'sawtooth', 0.1);
        setTimeout(() => this.playTone(220 * m, 0.2, 'sawtooth', 0.12), 100);
      }
      soundHot(m = 1) {
        this.playTone(659.25 * m, 0.1, 'sine', 0.12);
        setTimeout(() => this.playTone(783.99 * m, 0.1, 'sine', 0.12), 70);
        setTimeout(() => this.playTone(987.77 * m, 0.15, 'sine', 0.14), 140);
      }
      soundCold(m = 1) {
        this.playTone(440 * m, 0.1, 'sine', 0.1);
        setTimeout(() => this.playTone(370 * m, 0.12, 'sine', 0.1), 70);
        setTimeout(() => this.playTone(311.13 * m, 0.2, 'sine', 0.12), 140);
      }

      speakReaction(reaction, lang = 'he') {
        if (this.isMuted) return;
        const pitchMult = this.voiceGender === 'female' ? 1.15 : 0.85;
        if (reaction === 'yes') this.soundYes(pitchMult);
        else if (reaction === 'no') this.soundNo(pitchMult);
        else if (reaction === 'hot') this.soundHot(pitchMult);
        else if (reaction === 'cold') this.soundCold(pitchMult);

        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          let text = '';
          if (lang === 'he') {
            if (reaction === 'yes') text = 'כן!';
            else if (reaction === 'no') text = 'לא!';
            else if (reaction === 'hot') text = 'חם!';
            else if (reaction === 'cold') text = 'קר!';
          } else {
            if (reaction === 'yes') text = 'Yes!';
            else if (reaction === 'no') text = 'No!';
            else if (reaction === 'hot') text = 'Hot!';
            else if (reaction === 'cold') text = 'Cold!';
          }
          const u = new SpeechSynthesisUtterance(text);
          u.lang = lang === 'he' ? 'he-IL' : 'en-US';
          u.pitch = this.voiceGender === 'female' ? 1.35 : 0.75;
          u.rate = 1.0;
          window.speechSynthesis.speak(u);
        } catch(e) {}
      }

      soundCorrectGuess(winnerName, lang = 'he') {
        this.soundSuccess();
        setTimeout(() => this.soundWin(), 200);
        if (this.isMuted || !('speechSynthesis' in window) || !winnerName) return;
        try {
          setTimeout(() => {
            const text = lang === 'he' ? `תשובה נכונה מאת ${winnerName}!` : `Correct answer by ${winnerName}!`;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang === 'he' ? 'he-IL' : 'en-US';
            window.speechSynthesis.speak(u);
          }, 400);
        } catch(e) {}
      }
    }

    // ==========================================
    // 4. HEBREW KEYBOARD UTILS
    // ==========================================
    const EN_TO_HE_MAP = {
      q: '/', w: "'", e: 'ק', r: 'ר', t: 'א', y: 'ט', u: 'ו', i: 'ן', o: 'ם', p: 'פ',
      a: 'ש', s: 'ד', d: 'ג', f: 'כ', g: 'ע', h: 'י', j: 'ח', k: 'ל', l: 'ך', ';': 'ף',
      z: 'ז', x: 'ס', c: 'ב', v: 'ה', b: 'נ', n: 'מ', m: 'צ', ',': 'ת', '.': 'ץ'
    };
    const HEBREW_KEYBOARD_ROWS = [
      ['ק', 'ר', 'א', 'ט', 'ו', 'ן', 'ם', 'פ'],
      ['ש', 'ד', 'ג', 'כ', 'ע', 'י', 'ח', 'ל', 'ך', 'ף'],
      ['ז', 'ס', 'ב', 'ה', 'נ', 'מ', 'צ', 'ת', 'ץ']
    ];
    function normalizeHebrewInput(char) {
      const lower = char.toLowerCase();
      if (EN_TO_HE_MAP[lower]) return EN_TO_HE_MAP[lower];
      if (/[\u0590-\u05FF]/.test(char)) return char;
      return null;
    }
    function lettersMatch(a, b) {
      if (a === b) return true;
      const finals = { 'כ':'ך','ך':'כ','מ':'ם','ם':'מ','נ':'ן','ן':'נ','פ':'ף','ף':'פ','צ':'ץ','ץ':'צ' };

    }

          <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden my-2 border border-white/10">
            <div
              className={`h-full transition-all duration-1000 ${progressPercent > 50 ? 'bg-emerald-500' : progressPercent > 20 ? 'bg-amber-500' : 'bg-rose-500'}`}
              style={{ width: `${progressPercent}%` }}
            />
          </div>

          {/* Winner Banner */}
          {winnerAnimation && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md animate-fade-in">
              <div className="bg-gradient-to-r from-pink-500 to-purple-600 p-8 rounded-3xl text-center shadow-2xl scale-110">
                <span className="text-6xl mb-3 block">👑</span>
                <h2 className="text-3xl font-black text-white">{winnerAnimation}</h2>
                <p className="text-yellow-200 font-bold mt-1 text-lg">{t.winnerAnswered}</p>
              </div>
            </div>
          )}

          {/* Card View Area */}
          <div className="w-full my-auto flex flex-col items-center">
            {/* Category Badge */}
            <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 border border-white/15 text-xs text-pink-300 font-bold mb-2">
              <span>{t.categoryLabel}</span>
              <span className="text-white">{isEn ? (card.category_en || card.category) : card.category}</span>
            </div>

            {/* Image or Mystery Box */}
            <div className="relative w-72 h-56 md:w-80 md:h-64 rounded-3xl overflow-hidden border-2 border-white/20 shadow-2xl bg-slate-900 flex items-center justify-center">
              {isImageHolder ? (
                <>
                  <img
                    src={card.image}
                    alt="Mystery"
                    className="w-full h-full object-cover"
                  />
                  <div className="absolute top-2 right-2 px-3 py-1 rounded-full bg-black/60 backdrop-blur-md text-emerald-400 font-black text-xs border border-emerald-500/30">
                    {t.holderRole}
                  </div>
                  <div className="absolute bottom-2 inset-x-2 bg-black/75 backdrop-blur-md py-1.5 px-3 rounded-2xl text-center border border-white/15">
                    <span className="text-xs text-slate-300">{t.wordLabel}</span>
                    <span className="text-base font-black text-pink-400 mr-1">{targetWord}</span>
                  </div>
                </>
              ) : (
                <div className="flex flex-col items-center justify-center p-6 text-center">
                  <span className="text-7xl animate-pulse select-none">❓</span>
                  <p className="text-slate-300 font-bold text-sm mt-3">{t.guesserMystery}</p>
                  <p className="text-xs text-pink-400 mt-1 font-medium">{t.guesserRole}</p>
                </div>
              )}

              {/* Reaction Popup Animation */}
              {reactionFlash && (
                <div className="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm animate-bounce-short">
                  <div className="text-6xl font-black drop-shadow-lg">
                    {reactionFlash === 'yes' && '✅ כן!'}
                    {reactionFlash === 'no' && '❌ לא'}
                    {reactionFlash === 'hot' && '🔥 חם!'}
                    {reactionFlash === 'cold' && '❄️ קר...'}
                  </div>
                </div>
              )}
            </div>

            {/* Hint Box (if triggered) */}
            {showHint && (
              <div className="mt-3 px-4 py-2 rounded-2xl bg-amber-500/20 border border-amber-400/30 text-amber-200 text-xs font-bold text-center max-w-xs animate-fade-in">
                💡 {isEn ? (card.hint_en || card.hint) : card.hint}
              </div>
            )}

            {/* Word Letter Boxes */}
            <div className="flex items-center justify-center gap-2 my-4" dir="rtl">
              {Array.from({ length: wordLength }).map((_, idx) => (
                <div
                  key={idx}
                  className={`w-11 h-13 md:w-12 md:h-14 rounded-2xl border-2 flex items-center justify-center text-2xl font-black shadow-md transition-all ${inputLetters[idx] ? 'bg-pink-500/20 border-pink-400 text-white scale-105' : 'bg-white/5 border-white/20 text-transparent'}`}
                >
                  {inputLetters[idx] || '·'}
                </div>
              ))}
            </div>
          </div>

          {/* Controls Area: Holder Buttons vs Guesser Virtual Keyboard */}
          <div className="w-full">
            {isImageHolder ? (
              <div className="bg-white/10 backdrop-blur-md rounded-3xl p-4 border border-white/15 shadow-xl">
                <p className="text-xs text-center text-slate-300 font-bold mb-3">
                  {t.holderMsg}
                </p>
                <div className="grid grid-cols-2 gap-2 mb-3">
                  <button
                    onClick={() => handleHolderReaction('yes')}
                    className="py-3 px-4 rounded-2xl bg-emerald-600/40 hover:bg-emerald-600/60 border border-emerald-500/50 font-black text-emerald-200 text-base transition flex items-center justify-center gap-2"
                  >
                    <span>{t.btnYes}</span>
                  </button>
                  <button
                    onClick={() => handleHolderReaction('no')}
                    className="py-3 px-4 rounded-2xl bg-rose-600/40 hover:bg-rose-600/60 border border-rose-500/50 font-black text-rose-200 text-base transition flex items-center justify-center gap-2"
                  >
                    <span>{t.btnNo}</span>
                  </button>
                  <button
                    onClick={() => handleHolderReaction('hot')}
                    className="py-3 px-4 rounded-2xl bg-amber-600/40 hover:bg-amber-600/60 border border-amber-500/50 font-black text-amber-200 text-base transition flex items-center justify-center gap-2"
                  >
                    <span>{t.btnHot}</span>
                  </button>
                  <button
                    onClick={() => handleHolderReaction('cold')}
                    className="py-3 px-4 rounded-2xl bg-cyan-600/40 hover:bg-cyan-600/60 border border-cyan-500/50 font-black text-cyan-200 text-base transition flex items-center justify-center gap-2"
                  >
                    <span>{t.btnCold}</span>
                  </button>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => setShowHint(true)}
                    className="flex-1 py-2 px-3 rounded-xl bg-yellow-500/20 hover:bg-yellow-500/30 border border-yellow-500/30 text-yellow-300 text-xs font-bold transition"
                  >
                    {t.giveHint}
                  </button>
                  <button
                    onClick={onSkipCard}
                    className="flex-1 py-2 px-3 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-slate-300 text-xs font-bold transition"
                  >
                    {t.skipTurn}
                  </button>
                </div>
              </div>
            ) : (
              /* Virtual Keyboard for Guessers */
              <div className="bg-white/10 backdrop-blur-md rounded-3xl p-2.5 border border-white/15 shadow-xl">
                {HEBREW_KEYBOARD_ROWS.map((row, rIdx) => (
                  <div key={rIdx} className="flex justify-center gap-1 my-1">
                    {row.map(char => (
                      <button
                        key={char}
                        onClick={() => handleKeyClick(char)}
                        className="w-8 h-10 md:w-9 md:h-11 rounded-xl bg-white/15 hover:bg-white/30 active:scale-95 text-white font-bold text-base transition border border-white/10 flex items-center justify-center shadow-sm"
                      >
                        {char}
                      </button>
                    ))}
                    {rIdx === 2 && (
                      <button
                        onClick={handleDelete}
                        className="px-2.5 h-10 md:h-11 rounded-xl bg-rose-500/30 hover:bg-rose-500/50 text-rose-200 font-bold text-xs transition border border-rose-500/30 flex items-center justify-center"
                      >
                        ⌫
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* Players Live Mini-Board */}
            <div className="w-full flex items-center justify-around bg-black/40 rounded-2xl py-2 px-3 mt-2 border border-white/10 text-xs">
              {players.map(p => (
                <div key={p.id} className="flex items-center gap-1.5">
                  <span className="text-base">{p.avatar}</span>
                  <span className="font-bold text-slate-200">{p.name}</span>
                  <span className="px-2 py-0.5 rounded-full bg-pink-500/20 text-pink-300 font-black">
                    {p.score} {t.pts}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 9. LEADERBOARD MODAL
    // ==========================================
    const LeaderboardModal = ({ isOpen, onClose, language }) => {
      const [period, setPeriod] = useState('all');
      const isEn = language === 'en';

      const mockLeaderboard = [
        { rank: 1, name: 'נועה אלופה', avatar: '🦁', score: 240, streak: 8 },
        { rank: 2, name: 'דניאל המנחש', avatar: '🚀', score: 190, streak: 6 },
        { rank: 3, name: 'מאיה כוכבת', avatar: '🦄', score: 150, streak: 5 },
        { rank: 4, name: 'יוסי שחקן', avatar: '🦊', score: 110, streak: 3 },
        { rank: 5, name: 'תמר מנחשת', avatar: '⭐', score: 90, streak: 2 },
      ];

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in">
          <div className="w-full max-w-md bg-slate-900 border border-white/20 rounded-3xl p-6 shadow-2xl text-right">
            <div className="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
              <button onClick={onClose} className="p-2 rounded-full bg-white/10 text-slate-300 hover:text-white">
                <IconX className="w-4 h-4" />
              </button>
              <h2 className="text-xl font-black text-white flex items-center gap-2">
                <span>{isEn ? 'Leaderboard' : 'טבלת אלופים ושיאים'}</span>
                <IconTrophy className="w-5 h-5 text-yellow-400" />
              </h2>
            </div>

            {/* Podium */}
            <div className="flex items-end justify-center gap-2 my-4 pt-2">
              {/* #2 */}
              <div className="flex flex-col items-center">
                <span className="text-2xl mb-1">{mockLeaderboard[1].avatar}</span>
                <span className="text-xs font-bold text-slate-300">{mockLeaderboard[1].name}</span>
                <div className="w-20 h-16 bg-slate-700/60 rounded-t-xl flex flex-col items-center justify-center border border-white/10 mt-1">
                  <span className="font-black text-slate-300 text-sm">🥈 #2</span>
                  <span className="text-xs text-pink-400 font-bold">{mockLeaderboard[1].score} pts</span>
                </div>
              </div>
              {/* #1 */}
              <div className="flex flex-col items-center">
                <span className="text-3xl mb-1 animate-bounce">{mockLeaderboard[0].avatar}</span>
                <span className="text-xs font-bold text-yellow-300">{mockLeaderboard[0].name}</span>
                <div className="w-24 h-24 bg-gradient-to-t from-yellow-600/40 to-yellow-500/20 rounded-t-xl flex flex-col items-center justify-center border border-yellow-400/40 mt-1 shadow-lg shadow-yellow-500/20">
                  <IconCrown className="w-5 h-5 text-yellow-400 mb-0.5" />
                  <span className="font-black text-yellow-300 text-base">🥇 #1</span>
                  <span className="text-xs text-yellow-200 font-black">{mockLeaderboard[0].score} pts</span>
                </div>
              </div>
              {/* #3 */}
              <div className="flex flex-col items-center">
                <span className="text-2xl mb-1">{mockLeaderboard[2].avatar}</span>
                <span className="text-xs font-bold text-slate-300">{mockLeaderboard[2].name}</span>
                <div className="w-20 h-12 bg-amber-800/40 rounded-t-xl flex flex-col items-center justify-center border border-amber-600/30 mt-1">
                  <span className="font-black text-amber-400 text-xs">🥉 #3</span>
                  <span className="text-xs text-pink-400 font-bold">{mockLeaderboard[2].score} pts</span>
                </div>
              </div>
            </div>

            {/* List */}
            <div className="space-y-2 mt-4 max-h-56 overflow-y-auto pr-1">
              {mockLeaderboard.map((item) => (
                <div key={item.rank} className="flex items-center justify-between p-2.5 rounded-2xl bg-white/5 border border-white/10 text-xs">
                  <div className="flex items-center gap-2">
                    <span className="font-black text-slate-400 w-4">#{item.rank}</span>
                    <span className="text-lg">{item.avatar}</span>
                    <span className="font-bold text-white">{item.name}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-amber-400 font-bold flex items-center gap-0.5">
                      <IconFlame className="w-3.5 h-3.5" /> {item.streak}
                    </span>
                    <span className="px-2.5 py-1 rounded-full bg-pink-500/20 text-pink-300 font-black">
                      {item.score} {isEn ? 'pts' : "נק'"}
                    </span>
                  </div>
                </div>
              ))}
            </div>

            <button
              onClick={onClose}
              className="w-full mt-5 py-3 rounded-2xl bg-white/10 hover:bg-white/20 text-white font-bold text-sm transition"
            >
              {isEn ? 'Close' : 'סגור'}
            </button>
          </div>
        </div>
      );
    };

    // ==========================================
    // 10. INTRO VIDEO MODAL
    // ==========================================
    const IntroVideoModal = ({ isOpen, onClose, language }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 animate-fade-in">
          <div className="w-full max-w-lg bg-slate-900 border border-white/20 rounded-3xl p-5 shadow-2xl text-center">
            <div className="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
              <button onClick={onClose} className="p-2 rounded-full bg-white/10 text-slate-300 hover:text-white">
                <IconX className="w-4 h-4" />
              </button>
              <h3 className="font-black text-white text-base">🎥 צפו איך משחקים</h3>
            </div>
            <div className="w-full aspect-video rounded-2xl overflow-hidden bg-black border border-white/15 my-2">
              <video
                src="https://res.cloudinary.com/afjcyngg/video/upload/gemini_generated_video_6c8f0e40.mp4"
                controls
                autoPlay
                className="w-full h-full object-cover"
              />
            </div>
            <button
              onClick={onClose}
              className="w-full mt-3 py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-sm transition shadow-lg shadow-pink-500/20"
            >
              הבנתי, בואו נתחיל לשחק! 🚀
            </button>
          </div>
        </div>
      );
    };

    // ==========================================
    // 11. MAIN APP ROOT COMPONENT
    // ==========================================
    function App() {
      const [screen, setScreen] = useState('welcome');
      const [language, setLanguage] = useState(() => localStorage.getItem('ttg_lang') || 'he');
      const [isMuted, setIsMuted] = useState(sounds.isMuted);
      const [turnDuration, setTurnDuration] = useState(30);
      const [timeLeft, setTimeLeft] = useState(30);
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isImageHolder, setIsImageHolder] = useState(false);
      const [isLeaderboardOpen, setIsLeaderboardOpen] = useState(false);
      const [isIntroVideoOpen, setIsIntroVideoOpen] = useState(false);

      const [players, setPlayers] = useState([
        { id: 'p1', name: 'אני', avatar: '🦁', score: 0, streak: 0, isHost: true },
        { id: 'p2', name: 'משתתף 1', avatar: '🚀', score: 0, streak: 0, isHost: false },
      ]);

      const toggleLanguage = () => {
        const next = language === 'he' ? 'en' : 'he';
        setLanguage(next);
        localStorage.setItem('ttg_lang', next);
        document.documentElement.lang = next;
        document.documentElement.dir = next === 'he' ? 'rtl' : 'ltr';
      };

      const toggleMute = () => {
        const muted = sounds.toggleMute();
        setIsMuted(muted);
      };

      // Turn countdown timer
      useEffect(() => {
        if (screen !== 'game') return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              sounds.soundWarning();
              // Auto advance
              setCurrentCardIndex(c => (c + 1) % DEFAULT_CARDS.length);
              setIsImageHolder(h => !h);
              return turnDuration;
            }
            if (prev <= 6) sounds.soundTick();
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [screen, turnDuration]);

      const handleCardSolved = (winnerId, points) => {
        setPlayers(prev => prev.map(p => {
          if (p.id === winnerId) {
            return { ...p, score: p.score + points, streak: p.streak + 1 };
          }
          return p;
        }));
        setCurrentCardIndex(c => (c + 1) % DEFAULT_CARDS.length);
        setIsImageHolder(h => !h);
        setTimeLeft(turnDuration);
      };

      const handleSkipCard = () => {
        sounds.soundDelete();
        setCurrentCardIndex(c => (c + 1) % DEFAULT_CARDS.length);
        setIsImageHolder(h => !h);
        setTimeLeft(turnDuration);
      };

      return (
        <div className="relative min-h-screen text-slate-100 flex flex-col justify-between overflow-x-hidden">
          <QuestionMarksBackground />

          {screen === 'welcome' && (
            <RoleSelectScreen
              onOpenHost={() => { setIsImageHolder(true); setScreen('game'); setTimeLeft(turnDuration); }}
              onOpenPlayer={() => { setIsImageHolder(false); setScreen('game'); setTimeLeft(turnDuration); }}
              onQuickStart={() => { setIsImageHolder(false); setScreen('game'); setTimeLeft(turnDuration); }}
              onOpenVideo={() => setIsIntroVideoOpen(true)}
              onOpenLeaderboard={() => setIsLeaderboardOpen(true)}
              language={language}
              onToggleLanguage={toggleLanguage}
              isMuted={isMuted}
              onToggleMute={toggleMute}
              turnDuration={turnDuration}
              onChangeDuration={(d) => setTurnDuration(d)}
            />
          )}

          {screen === 'game' && (
            <GameTable
              cards={DEFAULT_CARDS}
              currentCardIndex={currentCardIndex}
              isImageHolder={isImageHolder}
              timeLeft={timeLeft}
              turnDuration={turnDuration}
              players={players}
              myPlayerId="p1"
              onCardSolved={handleCardSolved}
              onSkipCard={handleSkipCard}
              onLeaveGame={() => setScreen('welcome')}
              onOpenLeaderboard={() => setIsLeaderboardOpen(true)}
              isMuted={isMuted}
              onToggleMute={toggleMute}
              language={language}
              onToggleLanguage={toggleLanguage}
            />
          )}

          <LeaderboardModal
            isOpen={isLeaderboardOpen}
            onClose={() => setIsLeaderboardOpen(false)}
            language={language}
          />

          <IntroVideoModal
            isOpen={isIntroVideoOpen}
            onClose={() => setIsIntroVideoOpen(false)}
            language={language}
          />
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
